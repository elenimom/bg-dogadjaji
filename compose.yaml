name: bg-events
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bg_events
      POSTGRES_USER: bg_events
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env fajlu}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bg_events -d bg_events"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
