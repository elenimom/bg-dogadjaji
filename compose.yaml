name: bg-events
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bg_events
      POSTGRES_USER: bg_events
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env fajlu}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bg_events -d bg_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &database_environment
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: bg_events
      PGUSER: bg_events
      PGPASSWORD: ${DB_PASSWORD:?Postavi DB_PASSWORD u .env fajlu}
    command: ["node", "scripts/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *database_environment
      # Lokalni HTTP prikaz; za javnu produkciju koristiti HTTPS i production.
      NODE_ENV: development
      APP_ORIGIN: http://localhost:5173
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
